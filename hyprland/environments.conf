# Environment variables and startup applications

### Zoom share screen option 
#exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
env = XDG_CURRENT_DESKTOP,hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,hyprland
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=hyprland

### xwayland support 
xwayland {
  force_zero_scaling = true
  use_nearest_neighbor = false
}

# ----------------------------------------------------- 
# Cursor - disable hardware cursors to fix disappearing
# cursor over Wine/XWayland popup windows
# ----------------------------------------------------- 
cursor {
    no_hardware_cursors = true
}

# Some default env vars
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = HYPRCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

# GTK / GNOME dark theme preference
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'

# Execute your favorite apps at launch
exec-once = /home/james/.config/hypr/scripts/switch_monitors.sh --randomize


# Main Monitor Profile (3 Monitors: Laptop Far Left -> HP M24f FHD Middle Main -> HP 24fw Far Right)

# Internal Laptop Screen - Placed to the left of Main
monitor = desc:BOE 0x091B, 1920x1080@60, -1920x0, 1

# External Monitor 1 (HP M24f FHD, DP-4) - Middle Main Monitor at 0x0
monitor = desc:HP Inc. HP M24f FHD 3CM1321BNL, 1920x1080@60, 0x0, 1

# External Monitor 2 (HP 24fw, DP-3) - Placed to the right of Main
monitor = desc:HP Inc. HP 24fw 3CM0011DQD, 1920x1080@60, 1920x0, 1

# --- Workspace bindings ---
# Note: keybindings.conf maps SUPER+1..0 to `<monitor_id>01`..`<monitor_id>10`:
#   ID 0 (eDP-1 / BOE 0x091B)          -> Workspaces 1-10
#   ID 1 (DP-3  / HP 24fw 3CM0011DQD)  -> Workspaces 101-110
#   ID 2 (DP-4  / HP M24f 3CM1321BNL)  -> Workspaces 201-210

# Laptop screen (Far Left, ID 0) (Workspaces 1-10)
workspace = 1, monitor:desc:BOE 0x091B, default:true
workspace = 2, monitor:desc:BOE 0x091B
workspace = 3, monitor:desc:BOE 0x091B
workspace = 4, monitor:desc:BOE 0x091B
workspace = 5, monitor:desc:BOE 0x091B
workspace = 6, monitor:desc:BOE 0x091B
workspace = 7, monitor:desc:BOE 0x091B
workspace = 8, monitor:desc:BOE 0x091B
workspace = 9, monitor:desc:BOE 0x091B
workspace = 10, monitor:desc:BOE 0x091B

# HP M24f FHD (Middle / Main, ID 2) (Workspaces 201-210)
workspace = 201, monitor:desc:HP Inc. HP M24f FHD 3CM1321BNL, default:true
workspace = 202, monitor:desc:HP Inc. HP M24f FHD 3CM1321BNL
workspace = 203, monitor:desc:HP Inc. HP M24f FHD 3CM1321BNL
workspace = 204, monitor:desc:HP Inc. HP M24f FHD 3CM1321BNL
workspace = 205, monitor:desc:HP Inc. HP M24f FHD 3CM1321BNL
workspace = 206, monitor:desc:HP Inc. HP M24f FHD 3CM1321BNL
workspace = 207, monitor:desc:HP Inc. HP M24f FHD 3CM1321BNL
workspace = 208, monitor:desc:HP Inc. HP M24f FHD 3CM1321BNL
workspace = 209, monitor:desc:HP Inc. HP M24f FHD 3CM1321BNL
workspace = 210, monitor:desc:HP Inc. HP M24f FHD 3CM1321BNL

# HP 24fw (Far Right, ID 1) (Workspaces 101-110)
workspace = 101, monitor:desc:HP Inc. HP 24fw 3CM0011DQD, default:true
workspace = 102, monitor:desc:HP Inc. HP 24fw 3CM0011DQD
workspace = 103, monitor:desc:HP Inc. HP 24fw 3CM0011DQD
workspace = 104, monitor:desc:HP Inc. HP 24fw 3CM0011DQD
workspace = 105, monitor:desc:HP Inc. HP 24fw 3CM0011DQD
workspace = 106, monitor:desc:HP Inc. HP 24fw 3CM0011DQD
workspace = 107, monitor:desc:HP Inc. HP 24fw 3CM0011DQD
workspace = 108, monitor:desc:HP Inc. HP 24fw 3CM0011DQD
workspace = 109, monitor:desc:HP Inc. HP 24fw 3CM0011DQD
workspace = 110, monitor:desc:HP Inc. HP 24fw 3CM0011DQD

# Per-workspace layouts chosen with the layout switcher (super+t)
source = ~/.config/hypr/hyprland/workspace_layouts/main.conf

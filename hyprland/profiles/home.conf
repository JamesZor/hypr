# Home Monitor Profile (3 Monitors)

# Internal Laptop Screen
monitor = desc:BOE 0x091B, 1920x1080@60, 0x0, 1

# External Monitor 1 (HP 24fw) - Placed above laptop
monitor = desc:HP Inc. HP 24fw 3CM0011DQD, 1920x1080@60, 0x-1080, 1

# External Monitor 2 (HP M24f) - Placed to the left of HP 24fw
monitor = desc:HP Inc. HP M24f FHD 3CM1321BNL, 1920x1080@60, -1920x-1080, 1

# --- Workspace bindings ---
# Laptop screen (Workspaces 1-10)
workspace = 1, monitor:desc:BOE 0x091B, default:true
workspace = 2, monitor:desc:BOE 0x091B
workspace = 3, monitor:desc:BOE 0x091B

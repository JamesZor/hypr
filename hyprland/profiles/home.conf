# Home Monitor Profile (Laptop + Lenovo L34W-4C curved ultrawide)

# Lenovo L34W-4C 34" curved (3440x1440, 48-120Hz VA) - Main Monitor at 0x0
# Capped at @60 via the USB-C hub's HDMI port. With a direct USB-C -> DisplayPort
# cable change to 3440x1440@120 (check `hyprctl monitors` for available modes).
# vrr 2 = adaptive sync for fullscreen only (avoids VA flicker on the desktop)
monitor = desc:Lenovo Group Limited L34W-4C UPP07V5W, 3440x1440@60, 0x0, 1, vrr, 2

# Internal Laptop Screen - Placed to the right of Lenovo, bottom edges aligned
monitor = desc:BOE 0x091B, 1920x1080@60, 3440x360, 1

# --- Workspace bindings ---
# Laptop screen (Workspaces 1-10)
workspace = 1, monitor:desc:BOE 0x091B, default:true
workspace = 2, monitor:desc:BOE 0x091B
workspace = 3, monitor:desc:BOE 0x091B
workspace = 4, monitor:desc:BOE 0x091B
workspace = 5, monitor:desc:BOE 0x091B
workspace = 6, monitor:desc:BOE 0x091B
workspace = 7, monitor:desc:BOE 0x091B
workspace = 8, monitor:desc:BOE 0x091B
workspace = 9, monitor:desc:BOE 0x091B
workspace = 10, monitor:desc:BOE 0x091B

# Lenovo L34W-4C - Main (Workspaces 101-110), centred master layout
workspace = 101, monitor:desc:Lenovo Group Limited L34W-4C UPP07V5W, layout:master, default:true
workspace = 102, monitor:desc:Lenovo Group Limited L34W-4C UPP07V5W, layout:master
workspace = 103, monitor:desc:Lenovo Group Limited L34W-4C UPP07V5W, layout:master
workspace = 104, monitor:desc:Lenovo Group Limited L34W-4C UPP07V5W, layout:master
workspace = 105, monitor:desc:Lenovo Group Limited L34W-4C UPP07V5W, layout:master
workspace = 106, monitor:desc:Lenovo Group Limited L34W-4C UPP07V5W, layout:master
workspace = 107, monitor:desc:Lenovo Group Limited L34W-4C UPP07V5W, layout:master
workspace = 108, monitor:desc:Lenovo Group Limited L34W-4C UPP07V5W, layout:master
workspace = 109, monitor:desc:Lenovo Group Limited L34W-4C UPP07V5W, layout:master
workspace = 110, monitor:desc:Lenovo Group Limited L34W-4C UPP07V5W, layout:master

# Per-workspace layouts chosen with the layout switcher (super+t)
source = ~/.config/hypr/hyprland/workspace_layouts/home.conf

# Office Monitor Profile (3 Monitors)

# External Monitor 1 (HP 24fw) - Main Monitor at 0x0
monitor = desc:HP Inc. HP 24fw 3CM0371MB4, 1920x1080@60, 0x0, 1

# External Monitor 2 (HP 24fw) - Placed to the right of Main
monitor = desc:HP Inc. HP 24fw 3CM9480NYW, 1920x1080@60, 1920x0, 1

# Internal Laptop Screen - Placed below Main
monitor = desc:BOE 0x091B, 1920x1080@60, 0x1080, 1

# --- Workspace bindings ---
# Laptop screen (Workspaces 1-10)
workspace = 1, monitor:desc:BOE 0x091B, default:true
workspace = 2, monitor:desc:BOE 0x091B
workspace = 3, monitor:desc:BOE 0x091B
workspace = 4, monitor:desc:BOE 0x091B
